[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-channel-failure-lab"
version = "0.1.0"
description = "Measure how simulated EEG channel failures affect a trained CSP+LDA classifier"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "mne>=1.6",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require real downloaded EEG data",
    "synth: synthetic end-to-end workflow tests",
]
testpaths = ["tests"]
# Windows sandbox denies the default pytest-of-<user> temp root; use the
# approved local temp directory instead.
addopts = "--basetemp=C:/Users/munte/AppData/Local/Temp/opencode/pytest"
