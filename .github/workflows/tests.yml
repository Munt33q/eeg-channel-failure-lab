name: tests

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q -m "not integration"
